spring.application.name=demo

# Real deployments pass credentials via environment variables; the values after ':' are local-dev defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/java}
spring.datasource.username=${DB_USERNAME:aziz}
spring.datasource.password=${DB_PASSWORD:aziz}

spring.jpa.hibernate.ddl-auto=update
# Keep DB access inside the service layer instead of lazily loading during JSON rendering
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
